<html lang="de">

<title>SunSus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='18' fill='%23ffd23a' stroke='%2315171d' stroke-width='4'/%3E%3Cg stroke='%23ffb21c' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 4v6M32 54v6M4 32h6M54 32h6M12 12l4 4M48 48l4 4M12 52l4-4M48 16l4-4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--out:#15171d;--panel:#262b3a;--panel2:#1c2030;--sun:#ffd23a;--sun2:#ffb21c;--red:#ff4a4a;--green:#3fd68a;--blue:#7ad0ff;--text:#f4f6fa;--muted:#a9b2c3;--act:92px}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;background:#070b1e;color:var(--text);font-family:ui-rounded,"SF Pro Rounded",Nunito,"Trebuchet MS",system-ui,sans-serif;font-weight:800;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.ingame{touch-action:none}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
#bg,#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{z-index:1}
#joy-zone{position:fixed;left:0;bottom:0;width:55%;height:75%;z-index:5;display:none}
body.ingame #joy-zone{display:block}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.12);border:4px solid rgba(255,255,255,.35);z-index:6;pointer-events:none;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#joy-knob{position:absolute;left:37px;top:37px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.75);border:4px solid var(--out)}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#hud>.roomname,#hud>.sabbar,#hud>.netstatus,#hud>.fps{pointer-events:none}
#screens{position:fixed;inset:0;z-index:40;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:var(--panel);border:3px solid var(--out);border-radius:12px;padding:8px 14px;box-shadow:0 4px 0 var(--out);text-align:center;transition:opacity .4s,transform .4s;font-size:15px}
.toast.out{opacity:0;transform:translateY(-10px)}
.toast.error{background:#7a1f22}.toast.warn{background:#6b5310}.toast.ok{background:#1e5a3a}
/* buttons */
.btn{font-family:inherit;font-weight:900;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:14px;border:4px solid var(--out);background:linear-gradient(#f7f9fc,#cdd5e1);color:var(--out);box-shadow:0 5px 0 var(--out),inset 0 3px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(0,0,0,.08);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;min-height:48px;text-transform:none}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--out)}
.btn .ico svg{width:26px;height:26px;display:block}
.btn.primary{background:linear-gradient(#ffe57a,#ffbd1f)}
.btn.danger{background:linear-gradient(#ff7a6a,#e0352b);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:#c9d1dc;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.btn.big{font-size:22px;padding:14px 22px;min-height:62px}
.btn.small{font-size:14px;padding:6px 12px;min-height:38px;border-width:3px;box-shadow:0 3px 0 var(--out)}
.btn.small .ico svg{width:20px;height:20px}
.btn.round{width:52px;height:52px;padding:0;border-radius:14px;min-height:0;background:rgba(232,237,242,.92)}
.btn.round .ico svg{width:32px;height:32px}
.btn.round.tiny{width:30px;height:30px;border-width:3px;box-shadow:0 2px 0 var(--out);border-radius:8px}
.btn.round.tiny .ico svg{width:16px;height:16px}
.btn.round.small{width:38px;height:38px}.btn.round.small .ico svg{width:22px;height:22px}
.btn.disabled{opacity:.5}
.btn.chip{font-size:13px;padding:4px 10px;min-height:30px;border-width:2px;box-shadow:0 2px 0 var(--out);border-radius:20px}
.btn.step{width:40px;height:40px;padding:0;min-height:0;font-size:22px;border-width:3px;box-shadow:0 3px 0 var(--out)}
.btn.tab{font-size:14px;padding:6px 12px;min-height:38px;border-width:3px;box-shadow:0 3px 0 var(--out);background:#9aa7b8}
.btn.tab.on,.btn.segb.on{background:var(--sun)}
.btn.segb{font-size:14px;padding:6px 12px;min-height:38px;border-width:3px;box-shadow:0 3px 0 var(--out);border-radius:10px}
.badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border:2px solid var(--out);border-radius:12px;font-size:12px;padding:0 6px;min-width:22px;text-align:center}
.btn{position:relative}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}.row.end{justify-content:flex-end}
.muted{color:var(--muted);font-weight:700}.small{font-size:13px}
.outline-text{text-shadow:-2px -2px 0 var(--out),2px -2px 0 var(--out),-2px 2px 0 var(--out),2px 2px 0 var(--out)}
/* menus */
.screen{max-width:820px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen h2{font-size:34px;margin:8px 0 0;font-weight:900;text-shadow:0 4px 0 var(--out)}
.logo svg{width:min(520px,88vw);height:auto;display:block;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.sunrays{animation:spin 30s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.reduced-motion .sunrays{animation:none}
.name-row{display:flex;gap:12px;align-items:center}
.me-preview{width:84px;height:84px;border-radius:20px;border:4px solid var(--out);background:#2b3a66;box-shadow:0 5px 0 var(--out);cursor:pointer;padding:0;overflow:hidden}
.me-preview img{width:100%;height:100%}
.name-input,.code-input,.chat-input{font-size:22px;font-weight:900;padding:10px 14px;border-radius:14px;border:4px solid var(--out);background:#fff;color:var(--out);min-width:0;outline:none}
.name-input{width:min(320px,60vw)}
.code-input{width:180px;text-align:center;letter-spacing:6px;text-transform:uppercase}
.name-input:focus,.code-input:focus{box-shadow:0 0 0 4px var(--sun)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(560px,94vw)}
.menu-grid .btn.big{grid-column:span 1}
.menu-grid>.btn:nth-child(n+3){font-size:16px}
.stats{color:var(--muted);font-size:14px}
.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
.footer a{color:var(--sun)}
.card{background:linear-gradient(rgba(34,41,68,.94),rgba(18,22,38,.94));border:4px solid var(--out);border-radius:18px;padding:16px 18px;width:min(640px,94vw);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.card h3{margin:0 0 8px;font-size:21px;display:flex;align-items:center;gap:8px}
.card h3 .ico svg{width:28px;height:28px}
.card p{margin:6px 0 10px;line-height:1.35}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;width:100%}
.how-grid .card{width:auto}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:2px solid rgba(255,255,255,.07)}
.srow .sl{font-size:16px}
.ssec{margin:14px 0 2px;color:var(--sun);font-size:15px;text-transform:uppercase;letter-spacing:1px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .val{min-width:74px;text-align:center;font-size:17px}
.toggle{font-family:inherit;font-weight:900;font-size:15px;min-width:74px;padding:8px 12px;border-radius:12px;border:3px solid var(--out);background:#7a8291;color:#fff;cursor:pointer}
.toggle.on{background:var(--green);color:var(--out)}
.toggle:disabled{opacity:.6}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.settings{width:min(560px,92vw)}
.settings input[type=range]{width:min(220px,40vw);accent-color:var(--sun)}
.keys{margin-top:10px;line-height:1.5}
.cos-layout{display:grid;grid-template-columns:auto 1fr;gap:16px;width:100%;align-items:start}
.cos-left{display:flex;flex-direction:column;gap:10px;align-items:center}
.cos-preview{width:min(300px,70vw);height:auto;aspect-ratio:1;border-radius:20px;border:4px solid var(--out);box-shadow:0 6px 0 var(--out)}
.cos-left .name-input{width:min(300px,70vw)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:4px}
.cos-item{font-family:inherit;font-weight:800;font-size:12px;color:#fff;background:rgba(255,255,255,.07);border:3px solid var(--out);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.cos-item img{width:64px;height:64px}
.cos-item .swatch{width:52px;height:52px;border-radius:50%;border:4px solid var(--out);margin:6px}
.cos-item.on{background:rgba(255,210,58,.3);border-color:var(--sun)}
.screen.overlayed{position:relative;z-index:30;background:rgba(7,11,30,.98);border-radius:20px;padding:16px;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:150}
.modal{background:linear-gradient(#2e3550,#1d2235);border:5px solid var(--out);border-radius:20px;padding:20px;max-width:92vw;box-shadow:0 8px 0 var(--out)}
.modal.small{width:400px}.modal.center{text-align:center}
.modal h2{margin:0 0 8px}
.spinner{width:52px;height:52px;border-radius:50%;border:7px solid rgba(255,255,255,.2);border-top-color:var(--sun);animation:spin 0.9s linear infinite;margin:6px auto}
/* HUD */
.topleft{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;max-width:min(400px,48vw)}
.taskbar .tb-label{font-size:13px;letter-spacing:1px;text-shadow:-2px -2px 0 var(--out),2px -2px 0 var(--out),-2px 2px 0 var(--out),2px 2px 0 var(--out)}
.tb-track{height:24px;width:min(380px,46vw);background:#3a4150;border:4px solid var(--out);border-radius:6px;overflow:hidden;margin-top:2px}
.tb-fill{height:100%;width:0;background:linear-gradient(#5ff0a0,#2fb46c);transition:width .6s}
.tl-row{display:flex;gap:4px;margin-top:6px;align-items:flex-start}
.tasktab{writing-mode:vertical-rl;transform:rotate(180deg);font-family:inherit;font-weight:900;font-size:13px;background:rgba(232,237,242,.9);border:3px solid var(--out);border-radius:8px;padding:8px 3px;cursor:pointer;color:var(--out)}
.tasklist{background:rgba(232,237,242,.82);color:#1b1d2b;border:3px solid var(--out);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.35;max-height:42vh;overflow:auto}
.tasklist.collapsed{display:none}
.tl-item.partial{color:#a07a00}.tl-item.done{color:#14894a}
.tl-role{font-size:13px;margin-bottom:4px;color:#1d4fb8}.tl-role.sabo{color:#c41e1e}.tl-role.ghost{color:#555}
.tl-sub{font-size:12px;color:#555}
.tl-sab{color:#d10f0f;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.topright{position:absolute;right:max(12px,env(safe-area-inset-right));top:12px;display:flex;gap:8px;align-items:center}
.ping{font-size:13px;color:#fff;text-shadow:0 2px 0 var(--out);margin-right:4px}
.roomname{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:26px;font-weight:900;white-space:nowrap;text-shadow:-3px -3px 0 var(--out),3px -3px 0 var(--out),-3px 3px 0 var(--out),3px 3px 0 var(--out)}
.sabbar{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#c41e1e;border:4px solid var(--out);border-radius:12px;padding:6px 16px;font-size:20px;animation:blink 0.8s steps(2) infinite;white-space:nowrap}
.netstatus{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:#6b5310;border:3px solid var(--out);border-radius:10px;padding:6px 12px}
.fps{position:absolute;right:14px;top:72px;font-size:12px}
.actions{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:14px;display:flex;flex-wrap:wrap-reverse;flex-direction:row;justify-content:flex-end;gap:8px;max-width:calc(var(--act)*3 + 30px)}
.act{width:var(--act);height:var(--act);border:none;background:rgba(0,0,0,.18);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:4px;touch-action:none;transition:transform .08s}
.act:active{transform:scale(.93)}
.act .ico svg{width:calc(var(--act)*.6);height:calc(var(--act)*.6);display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.act-lbl{font-family:inherit;font-size:13px;font-weight:900;color:#fff;text-shadow:-2px -2px 0 var(--out),2px -2px 0 var(--out),-2px 2px 0 var(--out),2px 2px 0 var(--out);white-space:nowrap}
.act-cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff;text-shadow:-3px -3px 0 var(--out),3px -3px 0 var(--out),-3px 3px 0 var(--out),3px 3px 0 var(--out);pointer-events:none}
.act.off{opacity:.38;filter:grayscale(.8)}
.act::after{content:'';position:absolute;inset:4px;border-radius:16px;background:conic-gradient(rgba(0,0,0,.6) calc(var(--cdp,0) * 360deg),transparent 0);pointer-events:none}
.ventnav{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.55);border:3px solid var(--out);border-radius:14px;padding:10px;max-width:92vw}
.vent-title{width:100%;text-align:center}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(22,27,46,.92);border:4px solid var(--sun);border-radius:14px;padding:10px 14px;max-width:min(640px,80vw);font-size:16px}
/* lobby */
.lobby{position:absolute;inset:0;pointer-events:none}
.lobby>*{pointer-events:auto}
.lobby-top{position:absolute;left:50%;top:10px;transform:translateX(-50%)}
.codebox{background:rgba(16,20,36,.92);border:4px solid var(--out);border-radius:18px;padding:6px 16px 8px;text-align:center;box-shadow:0 5px 0 var(--out)}
.cb-l{font-size:11px;color:var(--muted);letter-spacing:3px}
.cb-code{font-size:40px;letter-spacing:10px;color:var(--sun);line-height:1.05;text-shadow:0 3px 0 var(--out);padding-left:10px}
.cb-code.small{font-size:18px;letter-spacing:1px;padding:0}
.codebox .row{justify-content:center;margin-top:4px}
.lobby-roster{position:absolute;left:12px;bottom:12px;width:min(300px,42vw);background:rgba(16,20,36,.92);border:4px solid var(--out);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--out);max-height:calc(100vh - 140px)}
.roster-head{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;padding:2px 4px;text-align:left}
.roster-head .ico svg{width:26px;height:26px}
.roster-head .faces{display:flex;margin-left:auto}.roster-head .faces img{width:28px;height:28px;margin-left:-8px}
.lobby-roster.open .faces{display:none}
.lobby-roster .plist{display:none}
.lobby-roster.open .plist{display:flex}
.plist{overflow:auto;flex-direction:column;gap:4px;max-height:52vh}
.prow{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px 6px}
.prow img{width:36px;height:36px}
.prow.dc{opacity:.5}
.pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.tag{font-size:10px;padding:2px 6px;border-radius:8px;border:2px solid var(--out)}
.tag.host{background:var(--sun);color:var(--out)}.tag.bot{background:#7a8291}.tag.ready{background:var(--green);color:var(--out)}.tag.wait{background:#444}
.emotebar{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(240px,30vw);background:rgba(16,20,36,.85);border:3px solid var(--out);border-radius:16px;padding:6px}
.emo{font-size:24px;width:44px;height:44px;border-radius:12px;border:3px solid var(--out);background:linear-gradient(#f7f9fc,#cdd5e1);cursor:pointer;box-shadow:0 3px 0 var(--out);padding:0;line-height:1}
.emo:active{transform:translateY(2px);box-shadow:0 1px 0 var(--out)}
.lobby-tools{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(var(--act) + 26px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.warns{background:#6b5310;border:3px solid var(--out);border-radius:10px;padding:6px 10px;font-size:12px;max-width:min(520px,60vw)}
.lobby-bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.setsum{background:rgba(0,0,0,.55);border-radius:10px;padding:4px 12px;font-size:13px;white-space:nowrap}
.startbtn{min-width:240px;font-size:24px!important;gap:12px}
.startbtn .cnt{background:rgba(0,0,0,.18);border-radius:10px;padding:2px 8px;font-size:16px}
.hostset{width:min(560px,90vw)}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:8px}
.ov-panel{position:relative;background:linear-gradient(#2e3550,#1d2235);border:5px solid var(--out);border-radius:20px;padding:14px;max-width:96vw;max-height:96vh;overflow:auto;box-shadow:0 8px 0 var(--out)}
.ov-title{font-size:22px;margin:0 50px 10px 4px}
.ov-panel>.close{position:absolute;right:10px;top:10px;width:44px;height:44px}
.task-panel{width:min(600px,96vw)}
.mg-body{display:flex;flex-direction:column;align-items:center;gap:8px}
.mg-canvas{width:100%;max-height:62vh;height:auto;aspect-ratio:4/3;display:block;object-fit:contain;touch-action:none}
.mg-btn{font-family:inherit;font-weight:900;font-size:18px;padding:10px 24px;border-radius:14px;border:4px solid var(--out);background:var(--sun);box-shadow:0 4px 0 var(--out);cursor:pointer}
.mg-btn:disabled{opacity:.5}
.mg-status{margin-top:8px;text-align:center;font-size:15px;min-height:20px}
.mg-status.ok{color:#5fe08a}.mg-status.err{color:#ff8a7a}
.mg-prog{height:12px;background:#1d2230;border:3px solid var(--out);border-radius:8px;overflow:hidden;margin-top:8px}
.mg-prog-fill{height:100%;width:0;background:var(--green);transition:width .2s}
.keypad{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;align-items:start}
.note{background:#fff59a;color:#333;border:3px solid var(--out);border-radius:6px;padding:14px;transform:rotate(-3deg);font-size:16px;display:flex;flex-direction:column;align-items:center}
.note b{font-size:30px;letter-spacing:4px}
.kp-display{grid-column:2;background:#0d1f17;color:#5fe08a;border:3px solid var(--out);border-radius:8px;font-size:30px;letter-spacing:8px;text-align:center;padding:6px}
.kp-grid{grid-column:1/3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad .note{grid-row:1/2}
.kp-key{font-family:inherit;font-weight:900;font-size:22px;padding:10px;border-radius:12px;border:3px solid var(--out);background:#c9d1dc;box-shadow:0 3px 0 var(--out);cursor:pointer}
.kp-key.ok{background:var(--green)}
.map-panel{width:min(1100px,98vw)}
.mapwrap{position:relative}
.mapcv{width:100%;height:auto;aspect-ratio:3340/2080;display:block;max-height:78vh;object-fit:contain;background:#0b1230;border-radius:12px;border:3px solid var(--out)}
.sab-btn{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:4px solid var(--out);background:#ff6b6b;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 4px 0 var(--out)}
.sab-btn.doors{width:44px;height:44px;background:#e8edf2}
.sab-btn .ico svg{width:100%;height:100%}
.sab-btn.off{filter:grayscale(1);opacity:.6}
.sab-btn .cd{position:absolute;font-size:20px;color:#fff;text-shadow:-2px -2px 0 var(--out),2px 2px 0 var(--out)}
.cams-panel{width:min(1000px,98vw)}
.cams-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cam{position:relative;border:4px solid var(--out);border-radius:10px;overflow:hidden;background:#000}
.camcv{width:100%;height:auto;display:block;aspect-ratio:480/300}
.cam-lbl{position:absolute;left:8px;bottom:6px;font-size:14px;text-shadow:0 2px 0 #000}
.rec{position:absolute;right:8px;top:6px;color:#ff4a4a;font-size:12px;animation:blink 1.2s steps(2) infinite}
.vitals-panel{width:min(520px,94vw)}
.vital{display:grid;grid-template-columns:48px 1fr auto 80px;gap:10px;align-items:center;padding:4px;border-bottom:2px solid rgba(255,255,255,.07)}
.vital img{width:44px;height:44px}
.vital.ok b{color:#5fe08a}.vital.dead b{color:#ff6b6b}.vital.dc b{color:#aaa}
.ekg{height:22px;background:repeating-linear-gradient(90deg,transparent 0 8px,#5fe08a 8px 10px,transparent 10px 20px);animation:ekg 1s linear infinite;border-radius:4px;opacity:.7}
.vital.dead .ekg{background:#ff6b6b;height:3px;animation:none}
@keyframes ekg{to{background-position:20px 0}}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;width:min(520px,90vw)}
.pick{font-family:inherit;font-weight:800;background:rgba(255,255,255,.08);border:3px solid var(--out);border-radius:12px;color:#fff;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
/* chat */
.chatbox{position:fixed;right:12px;bottom:12px;width:min(400px,94vw);height:min(560px,80vh);background:var(--panel);border:5px solid var(--out);border-radius:18px;z-index:35;display:flex;flex-direction:column;padding:8px;box-shadow:0 8px 0 var(--out)}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px}
.chat-list,.m-chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px;background:rgba(0,0,0,.2);border-radius:10px}
.msg{display:flex;gap:6px;align-items:flex-start}
.msg img{width:34px;height:34px;flex:none}
.msg .bubble{background:#e8edf2;color:var(--out);border:3px solid var(--out);border-radius:12px;padding:4px 10px;display:flex;flex-direction:column;font-size:14px;max-width:85%;word-break:break-word;-webkit-user-select:text;user-select:text}
.msg .bubble b{text-shadow:-1px -1px 0 var(--out),1px -1px 0 var(--out),-1px 1px 0 var(--out),1px 1px 0 var(--out);font-size:13px}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bubble{background:#fff6c8}
.msg.dead .bubble{background:#b8c0cc;opacity:.85}
.msg.sys{justify-content:center;color:var(--muted);font-size:12px}
.quick{display:flex;flex-wrap:wrap;gap:4px;padding:6px 0}
.chat-row{display:flex;gap:6px}
.chat-row .chat-input{flex:1;font-size:16px;padding:8px 10px;border-width:3px}
/* meeting */
.meeting{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:32;display:flex;align-items:center;justify-content:center;padding:6px}
.tablet{width:min(1180px,98vw);height:min(720px,96vh);background:linear-gradient(#a9b4c2,#7e8a9b);border:7px solid var(--out);border-radius:28px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 0 var(--out);animation:slideup .35s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.m-head{background:#3c4558;border:4px solid var(--out);border-radius:14px;padding:6px 12px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.m-head h2{margin:0;font-size:26px}
.m-caller{color:#ffe08a;font-size:15px}
.m-main{flex:1;display:grid;grid-template-columns:1.55fr 1fr;gap:10px;min-height:0}
.m-left{display:flex;flex-direction:column;gap:8px;min-height:0;background:#4b5468;border:4px solid var(--out);border-radius:14px;padding:8px}
.plates{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;align-content:start}
.plate{position:relative;display:flex;align-items:center;gap:6px;background:#e8edf2;color:var(--out);border:3px solid var(--out);border-radius:12px;padding:3px 6px;min-height:52px}
.plate .pp{width:50px;height:50px;flex:none}
.plate .pn{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate.me{background:#fff6c8}
.plate.dead{background:#8b94a3;opacity:.7}
.plate.dead .pn{text-decoration:line-through}
.plate.dc{opacity:.5}
.plate.clickable{cursor:pointer}.plate.clickable:hover{box-shadow:0 0 0 3px var(--sun)}
.plate.sel{box-shadow:0 0 0 4px var(--sun)}
.plate .voted{position:absolute;right:4px;top:2px;font-size:9px;background:#3fd68a;border:2px solid var(--out);border-radius:6px;padding:0 4px}
.plate .myvote{font-size:22px;color:#14894a}
.plate .megaphone{font-size:18px}
.plate .confirm{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.plate .confirm .btn{width:40px;height:40px}
.plate .confirm .yes{background:var(--green)}.plate .confirm .no{background:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:1px;max-width:50%}
.chip-img{width:22px;height:22px;animation:pop .3s ease backwards}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.skiprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.skip-lbl{font-size:13px}
.m-right{display:flex;flex-direction:column;min-height:0;background:#4b5468;border:4px solid var(--out);border-radius:14px;padding:8px}
.m-timer{text-align:right;font-size:17px;color:#1b1d2b}
/* banners & big screens */
.banner{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fadein .25s}
.banner.killed{background:radial-gradient(#5a0d12,#120306)}
.banner.killed h2{font-size:40px;margin:0}
.kill-row{display:flex;align-items:center;gap:24px}
.kill-row img{width:min(160px,30vw)}
.zap{font-size:70px;animation:zap .3s ease infinite alternate}
@keyframes zap{to{transform:scale(1.3) rotate(10deg)}}
.banner.meetingb{background:#1b1d2b;overflow:hidden}
.banner.meetingb.body{background:#3a0a10}
.banner.meetingb h1{font-size:min(70px,11vw);margin:0;z-index:1;color:#fff;text-shadow:0 6px 0 var(--out);animation:zoom .5s ease}
.banner.meetingb img{width:min(180px,32vw);z-index:1;animation:zoom .6s ease}
@keyframes zoom{from{transform:scale(2.5);opacity:0}to{transform:none;opacity:1}}
.stripes{position:absolute;left:0;right:0;top:50%;height:46%;transform:translateY(-50%);background:repeating-linear-gradient(-45deg,#ffcf3a 0 30px,#15171d 30px 60px);opacity:.9;animation:stripes 1s linear infinite}
.banner.body .stripes{background:repeating-linear-gradient(-45deg,#ff4a4a 0 30px,#15171d 30px 60px)}
@keyframes stripes{to{background-position:85px 0}}
.bigscreen{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;overflow:auto}
.bigscreen h1{font-size:min(96px,16vw);margin:0;font-weight:900;text-shadow:0 6px 0 rgba(255,255,255,.12)}
.intro.crew h1{color:#7ad0ff}.intro.sabo h1{color:#ff4a4a}
.intro-sub{font-size:22px;color:#fff}
.intro-role{font-size:18px;color:var(--muted);max-width:640px}
.lineup{display:flex;justify-content:center;align-items:flex-end;margin-top:10px;max-width:96vw;flex-wrap:nowrap}
.lineup img{width:min(110px,16vw);margin:0 -14px;animation:rise .6s ease backwards;animation-delay:calc(var(--i)*60ms)}
.lineup img.me{width:min(150px,22vw);z-index:2}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.eject{background:#02030a}
.starfield{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fff 50%,transparent),radial-gradient(2px 2px at 80% 20%,#fff 50%,transparent),radial-gradient(1px 1px at 40% 80%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 90% 60%,#fff 50%,transparent),radial-gradient(1px 1px at 10% 90%,#fff 50%,transparent);background-size:300px 300px;animation:starmove 8s linear infinite}
@keyframes starmove{to{background-position:-300px 0}}
.floater{position:absolute;top:40%;width:min(140px,26vw);animation:float 6.5s linear forwards}
@keyframes float{from{left:-20%;transform:rotate(0)}to{left:110%;transform:rotate(720deg)}}
.eject-text{font-size:min(34px,6vw);z-index:1;min-height:1.3em}
.eject-sub{font-size:20px;color:var(--muted);z-index:1;min-height:1.3em}
.over.win h1{color:#5fe08a}.over.lose h1{color:#ff4a4a}
.over-reason{font-size:20px}
.over-stats{color:var(--muted)}
.over-roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px;width:min(900px,94vw);text-align:left}
.orow{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;padding:2px 8px;font-size:14px}
.orow img{width:34px;height:34px}
.orow span:first-of-type{flex:1}
.pausescreen{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.rotate-hint{display:none}
@media (orientation:portrait) and (max-width:600px){body.ingame .rotate-hint{display:block;position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:10px;font-size:13px;pointer-events:none}}
.plates-box{flex:1;min-height:0;overflow:auto}
.plates{overflow:visible}
.skip-box{flex:none}
/* intro */
.intro.pssst{background:#000}
.pssst-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;animation:zoom .5s ease}
.pssst-wrap img{width:min(200px,36vw);filter:brightness(.35) saturate(.6)}
.pssst-txt{font-size:min(84px,15vw);font-weight:900;color:#fff;letter-spacing:4px;text-shadow:0 0 30px rgba(255,255,255,.35)}
.reveal>*{position:relative;z-index:1}
.reveal>.spot,.over>.spot{position:absolute;inset:0;z-index:0;pointer-events:none}
.reveal.crew>.spot{background:radial-gradient(ellipse 60% 45% at 50% 72%,rgba(122,208,255,.32),transparent 70%),radial-gradient(ellipse 120% 60% at 50% 0%,rgba(122,208,255,.12),transparent)}
.reveal.sabo>.spot{background:radial-gradient(ellipse 60% 45% at 50% 72%,rgba(255,74,74,.35),transparent 70%),radial-gradient(ellipse 120% 60% at 50% 0%,rgba(255,74,74,.12),transparent)}
.reveal h1{animation:zoom .6s ease;text-shadow:0 0 40px currentColor,0 6px 0 rgba(0,0,0,.6)}
.over>*{position:relative;z-index:1}
.over.win>.spot{background:radial-gradient(ellipse 55% 40% at 50% 45%,rgba(95,224,138,.28),transparent 70%)}
.over.lose>.spot{background:radial-gradient(ellipse 55% 40% at 50% 45%,rgba(255,74,74,.25),transparent 70%)}
.over h1{text-shadow:0 0 40px currentColor,0 6px 0 rgba(0,0,0,.6);animation:zoom .6s ease}
.confetti{position:absolute!important;inset:0;overflow:hidden;pointer-events:none;z-index:0!important}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* kill cutscene */
.banner.killed{background:#0b0204}
.kill-band{position:relative;width:min(760px,96vw);height:220px;background:linear-gradient(90deg,#3a0610,#8a1020 50%,#3a0610);border-top:6px solid var(--out);border-bottom:6px solid var(--out);overflow:hidden;display:flex;align-items:center;justify-content:center}
.kill-band img{position:absolute;bottom:14px;width:150px}
.k-killer{left:8%;animation:lunge 1.1s cubic-bezier(.5,0,.3,1.4) forwards}
.k-victim{right:12%;animation:victim 1.1s steps(1) forwards}
.k-dead{right:8%;bottom:30px!important;opacity:0;animation:deadin 1.1s steps(1) forwards}
@keyframes lunge{0%{transform:translateX(-120px)}55%{transform:translateX(150px)}100%{transform:translateX(90px)}}
@keyframes victim{0%,59%{opacity:1}60%,100%{opacity:0}}
@keyframes deadin{0%,59%{opacity:0}60%,100%{opacity:1}}
.k-zap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;animation:zapin 1.1s forwards}
.k-zap span{font-size:90px;display:block;filter:drop-shadow(0 0 20px #fff)}
.k-zap i{position:absolute;left:50%;top:50%;width:46px;height:7px;margin-top:-3px;background:#fff6c8;transform-origin:0 50%;border-radius:4px;box-shadow:0 0 8px #fff}
@keyframes zapin{0%,50%{opacity:0;transform:translate(-50%,-50%) scale(.3)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
.banner.killed h2{margin:14px 0 0;font-size:36px}
.banner.killed p{color:var(--muted)}
/* phones in portrait: the game is meant to be played in landscape */
.rotate-block{display:none}
@media (orientation:portrait) and (max-width:620px){body.ingame .rotate-block{display:flex;position:fixed;inset:0;z-index:300;background:#070b1e;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:20px}}
.rotate-block .phone{width:70px;height:120px;border:6px solid #fff;border-radius:14px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* responsive */
@media (max-width:760px){.cos-layout{grid-template-columns:1fr}.m-main{grid-template-columns:1fr;grid-template-rows:1fr 190px}.plates{grid-template-columns:repeat(2,1fr)}}
@media (max-height:520px){
  :root{--act:72px}
  .act-lbl{font-size:11px}
  .tb-track{height:18px}
  .tasklist{font-size:12px;max-height:34vh}
  .roomname{font-size:20px;bottom:8px}
  .btn.round{width:44px;height:44px}.btn.round .ico svg{width:26px;height:26px}
  .tablet{padding:6px 8px;gap:4px;border-width:5px}
  .m-head h2{font-size:18px}.m-caller{font-size:12px}
  .m-main{grid-template-columns:1.6fr 1fr;grid-template-rows:none}
  .plates{grid-template-columns:repeat(3,1fr);gap:4px}
  .plate{min-height:38px;padding:1px 4px}.plate .pp{width:32px;height:32px}.plate .pn{font-size:12px}
  .m-right .quick{display:none}
  .lobby-roster{width:min(260px,38vw)}
  .cb-code{font-size:28px}
  .startbtn{min-width:150px;font-size:20px!important;min-height:52px!important}
  .setsum{display:none}
  .lobby-roster .faces img:nth-child(n+5){display:none}
  .cb-code{font-size:28px}
  .bigscreen h1{font-size:56px}
  .lineup img{width:70px}.lineup img.me{width:90px}
  .screen h2{font-size:26px}
  .mg-canvas{max-height:58vh}
}
body.big-ui{--act:110px}
body.big-ui .btn{font-size:19px}
.reduced-motion *{animation-duration:.01ms!important;transition:none!important}
</style>
